[project]
name = "vendor-risk-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhuwan Bokati", email = "bhuwanbkt2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5,<2",
    "mcp>=2.3.0,<3",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vendor-risk-analyzer = "vendor_risk_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests with no external services",
    "security: authorization, CSRF, and security regression tests",
    "integration: tests that require external services or infrastructure",
]

[tool.coverage.run]
branch = true
source = ["vendor_risk_analyzer"]

[tool.coverage.report]
show_missing = true
fail_under = 5
