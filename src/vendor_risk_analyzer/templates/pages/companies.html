<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Choose company · Vendor Risk Analyzer</title>
    <link rel="stylesheet" href="/static/css/app.css?v=2">
    <link rel="stylesheet" href="/static/css/auth-entry.css?v=1">
</head>
<body class="entry-page">
    <main class="entry-layout">
        <section class="entry-intro">
            <h1>Choose your company</h1>
            <p>Each company has its own vendors and permissions.</p>
        </section>
        <section class="entry-card">
            <h2>Company access</h2>
            {% for company in companies %}
            <button type="button" class="company-select primary-button" data-org-id="{{ company.zitadel_org_id }}">{{ company.name }}</button>
            {% else %}
            <p>Your companies have not been configured for this app. Contact your administrator.</p>
            {% endfor %}
            <p id="company-message" role="status"></p>
            <a href="/auth/logout">Sign out</a>
        </section>
    </main>
    <script src="/static/js/companies.js?v=1"></script>
</body>
</html>
