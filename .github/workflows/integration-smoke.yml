name: Integration Smoke

on:
  workflow_dispatch:
    inputs:
      vendor_id:
        description: "Existing vendor UUID with ready documents"
        required: true
        type: string
      query:
        description: "Vendor-scoped retrieval query"
        required: true
        default: "incident response notification timeline"
        type: string
      run_risk_analysis:
        description: "Also call the live risk-analysis LLM"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: integration-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked application dependencies
        run: uv sync --frozen --no-dev

      - name: Verify required secrets are configured
        shell: bash
        run: |
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL GitHub secret is missing."
            exit 1
          }
          test -n "$GEMINI_API_KEY" || {
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          }

      - name: Embedding provider smoke test
        run: uv run python scripts/test_embedding.py

      - name: Vendor-scoped retrieval smoke test
        run: |
          uv run python scripts/test_retrieval.py \
            --vendor-id "${{ inputs.vendor_id }}" \
            --query "${{ inputs.query }}" \
            --limit 5

      - name: Live vendor risk-analysis smoke test
        if: ${{ inputs.run_risk_analysis }}
        run: |
          uv run python scripts/test_real_risk_analysis.py \
            --vendor-id "${{ inputs.vendor_id }}"
